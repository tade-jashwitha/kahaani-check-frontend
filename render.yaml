# =============================================================================
# Render Blueprint Specification (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Service (FastAPI + Audio ML Pipelines)
  # ---------------------------------------------------------------------------
  - type: web
    name: kahaani-backend
    runtime: docker
    rootDir: kahaani-check-backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: LOCAL_DEV_MODE
        value: "true"
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: CORS_ORIGINS
        value: "https://kahaani-frontend.onrender.com"

  # ---------------------------------------------------------------------------
  # 2. Frontend Service (Next.js Standalone)
  # ---------------------------------------------------------------------------
  - type: web
    name: kahaani-frontend
    runtime: docker
    rootDir: kahaani-check-frontend-main
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_LOCAL_DEV
        value: "true"
